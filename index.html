  p.docs.forEach(function(d,k){
    h+='<div class="doc"><div class="doc-ic">PDF</div><div><div class="doc-t">'+(editing?editable(d.title,'doc:'+k+':title','Document title'):esc(d.title))+'</div>';
    h+=editing?'<textarea data-f="doc:'+k+':desc" rows="3" aria-label="Document description" style="min-height:80px;margin-top:8px">'+esc(d.desc)+'</textarea>':(d.desc?'<p>'+esc(d.desc)+'</p>':'');
    h+='<div class="tools"><a class="open-pdf" href="'+esc(src(d.id))+'" target="_blank" rel="noopener">Open PDF</a>';
    if(editing){h+='<button class="sm" data-act="doc-mv" data-k="'+k+'" data-d="-1">Up</button><button class="sm" data-act="doc-mv" data-k="'+k+'" data-d="1">Down</button><button class="sm danger" data-act="rm-doc" data-k="'+k+'">Remove</button>';}
    h+='</div></div></div>';
  });
  if(editing){h+='<button class="add" data-act="add-pdf">+ Add PDF</button>';}
  return h+'</div>';
}
function renderProject(i){
  var p=S.projects[i];
  var h='<header class="top"><button class="brand" data-act="back">'+esc(S.name)+'</button><nav class="nav"><button data-act="nav" data-to="projects">Projects</button><button data-act="nav" data-to="about">About</button></nav></header><main>';
  h+='<div style="padding-top:28px"><button class="back" data-act="back">Back to projects</button></div>';
  h+='<div class="pv-head"><div><div class="kicker">Project '+pad(i+1)+' of '+pad(S.projects.length)+'</div><h1>'+(editing?editable(p.title,'p:'+p.id+':title','Project title'):esc(p.title))+'</h1></div><div>';
  h+='<div class="kicker" style="margin-bottom:12px">'+(editing?editable(p.type,'p:'+p.id+':type','Type or studio')+' / '+editable(p.year,'p:'+p.id+':year','Year'):esc([p.type,p.year].filter(Boolean).join('  /  ')))+'</div>';
  h+=editing?'<textarea data-f="p:'+p.id+':desc" rows="6" aria-label="Project description">'+esc(p.desc)+'</textarea>':'<p>'+esc(p.desc)+'</p>';
  h+='</div></div>';
  h+=docsHtml(p);
  h+='<div class="figs">';
  p.images.forEach(function(id,k){
    h+='<figure class="fig" style="margin:0"><img src="'+esc(src(id))+'" alt="'+esc(p.title)+', image '+(k+1)+'" decoding="async"><figcaption class="fc"><span>Fig. '+pad(k+1)+(p.cover===id?'  /  cover':'')+'</span>';
    if(editing){h+='<span class="tools" style="padding:0"><button class="sm" data-act="img-mv" data-k="'+k+'" data-d="-1">Up</button><button class="sm" data-act="img-mv" data-k="'+k+'" data-d="1">Down</button><button class="sm" data-act="mk-cover" data-k="'+k+'">Make cover</button><button class="sm danger" data-act="rm-img" data-k="'+k+'">Remove</button></span>';}
    h+='</figcaption></figure>';
  });
  if(!p.images.length&&!editing){h+='<div class="empty">Images for this project are coming soon.</div>';}
  if(editing){h+='<button class="add" data-act="add-imgs">+ Add images</button>';}
  h+='</div>';
  var prev=S.projects[i-1],next=S.projects[i+1];
  h+='<div class="pager"><button data-act="open" data-id="'+(prev?prev.id:'')+'" '+(prev?'':'hidden')+'>&larr; '+esc(prev?prev.title:'')+'</button><button data-act="open" data-id="'+(next?next.id:'')+'" '+(next?'':'hidden')+'>'+esc(next?next.title:'')+' &rarr;</button></div></main>';
  return h;
}

function render(keepScroll){
  var y=window.scrollY;
  var i=view?find(view):-1;
  if(view&&i<0){view=null;}
  document.title=(S.name||TITLE)+' | Portfolio';
  app.innerHTML='<div class="wrap">'+(view?renderProject(i):renderHome())+'</div>';
  if(editing){
    document.body.classList.add('is-editing');
    var b=document.getElementById('editbar');if(b)b.remove();
    var bar=document.createElement('div');bar.id='editbar';bar.className='bar';
    bar.innerHTML='<span id="savestate">'+(dirty?'Unsaved changes':'Editing. Changes are not live until you save.')+'</span><button data-act="discard">Discard</button><button class="go" id="savebtn" data-act="save" '+(dirty?'':'disabled')+'>'+(saving?'Saving...':'Save changes')+'</button>';
    document.body.appendChild(bar);
  }else{
    document.body.classList.remove('is-editing');
    var o=document.getElementById('editbar');if(o)o.remove();
  }
  if(keepScroll){window.scrollTo(0,y);}else{window.scrollTo(0,0);}
}

function pick(multi,accept){
  return new Promise(function(res){
    fileIn.accept=accept||'image/png,image/jpeg,image/webp,image/gif';fileIn.multiple=!!multi;fileIn.value='';
    fileIn.onchange=function(){res(Array.prototype.slice.call(fileIn.files||[]));};
    fileIn.click();
  });
}
function upload(file){
  if(!api.assets){toast('Image upload is not available in this view.');return Promise.resolve(null);}
  return api.assets.upload(file).then(function(r){return r.id;}).catch(function(e){
    var c=e&&e.code;
    toast(c==='too_large'?'That image is over 20 MB. Export a smaller one.':c==='unsupported_type'?'Use a JPG, PNG, WebP or GIF image.':'Upload failed. Try again.');
    return null;
  });
}
function uploadMany(files){
  toast('Uploading '+files.length+' image'+(files.length>1?'s':'')+'...');
  var out=[];
  return files.reduce(function(chain,f){return chain.then(function(){return upload(f).then(function(id){if(id)out.push(id);});});},Promise.resolve()).then(function(){return out;});
}

function save(){
  if(saving||!api.artifact)return;
  saving=true;render(true);
  var css=document.getElementById('site-css').textContent;
  var js=document.getElementById('app-js').textContent;
  var rs=document.head.querySelector('style');
  var reset=(rs&&/safe-area/.test(rs.textContent))?rs.textContent:DEFAULT_RESET;
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  var fonts=document.querySelector('link[rel="stylesheet"]');
  var html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>'+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="site-css">'+css+'</style>\n'
    +(fonts?'<link rel="stylesheet" href="'+fonts.getAttribute('href')+'">\n':'')
    +'<div id="app"></div>\n<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>\n'
    +'<script type="application/json" id="site-data">'+json+'<\/script>\n<script id="app-js">'+js+'<\/script></body></html>';
  try{sessionStorage.setItem('pf-edit','1');}catch(e){}
  api.artifact.publish(html).then(function(){dirty=false;},function(e){
    saving=false;
    var c=e&&e.code;
    toast(c==='conflict'?'Someone saved first. Reloading with their version.':c==='not_writer'||c==='not_granted'?'You do not have permission to save this page.':c==='too_large'?'The page is too large to save. Remove some images.':'Save failed. Try again.');
    render(true);
  });
}

function setField(f,v){
  var p=f.split(':');
  if(f==='name'){S.name=v;}
  else if(f==='tagline'){S.tagline=v;}
  else if(f==='about'){S.about=v;}
  else if(p[0]==='d'){var d=S.details[+p[1]];if(d)d[p[2]]=v;}
  else if(p[0]==='p'){var i=find(p[1]);if(i>=0)S.projects[i][p[2]]=v;}
  else if(p[0]==='doc'){var pr=S.projects[find(view)];if(pr&&pr.docs&&pr.docs[+p[1]])pr.docs[+p[1]][p[2]]=v;}
  mark();
}
app.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  setField(t.dataset.f,t.isContentEditable?t.textContent:t.value);
});
app.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t.isContentEditable){e.preventDefault();return;}
  if((e.key==='Enter'||e.key===' ')&&t.dataset&&t.dataset.act==='open'&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}
});

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;
  var act=el.dataset.act,id=el.dataset.id,i;
  if(act==='nav'){
    var go=function(){var s=document.getElementById(el.dataset.to);if(s)s.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});};
    if(view){view=null;render();setTimeout(go,30);}else{go();}
  }
  else if(act==='top'){window.scrollTo({top:0,behavior:'smooth'});}
  else if(act==='open'){if(id){view=id;render();}}
  else if(act==='back'){view=null;render();var s=document.getElementById('projects');if(s)s.scrollIntoView();}
  else if(act==='edit-on'){editing=true;render(true);}
  else if(act==='discard'){
    if(dirty&&!el.dataset.armed){el.dataset.armed='1';el.textContent='Discard all changes?';return;}
    S=JSON.parse(ORIG);dirty=false;editing=false;try{sessionStorage.removeItem('pf-edit');}catch(x){}render(true);
  }
  else if(act==='save'){save();}
  else if(act==='mv'){i=find(id);var j=i+(+el.dataset.d);if(i>=0&&j>=0&&j<S.projects.length){var t=S.projects[i];S.projects[i]=S.projects[j];S.projects[j]=t;mark();render(true);}}
  else if(act==='del'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirm delete';return;}
    i=find(id);if(i>=0){S.projects.splice(i,1);mark();render(true);}
  }
  else if(act==='add-project'){S.projects.push({id:uid(),title:'New project',type:'',year:String(new Date().getFullYear()),desc:'',cover:'',images:[]});mark();render(true);}
  else if(act==='cover'){pick(false).then(function(fs){if(!fs.length)return;uploadMany(fs).then(function(ids){if(!ids.length)return;var p=S.projects[find(id)];p.cover=ids[0];if(p.images.indexOf(ids[0])<0)p.images.unshift(ids[0]);mark();render(true);});});}
  else if(act==='about-img'){pick(false).then(function(fs){if(!fs.length)return;uploadMany(fs).then(function(ids){if(ids.length){S.aboutImg=ids[0];mark();render(true);}});});}
  else if(act==='add-imgs'){pick(true).then(function(fs){if(!fs.length)return;uploadMany(fs).then(function(ids){if(!ids.length)return;var p=S.projects[find(view)];ids.forEach(function(x){p.images.push(x);});if(!p.cover)p.cover=ids[0];mark();render(true);});});}
  else if(act==='rm-img'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirm';return;}
    var p=S.projects[find(view)],k=+el.dataset.k,rid=p.images[k];p.images.splice(k,1);if(p.cover===rid)p.cover=p.images[0]||'';mark();render(true);
  }
  else if(act==='img-mv'){var q=S.projects[find(view)],a=+el.dataset.k,b=a+(+el.dataset.d);if(b>=0&&b<q.images.length){var tmp=q.images[a];q.images[a]=q.images[b];q.images[b]=tmp;mark();render(true);}}
  else if(act==='mk-cover'){var r=S.projects[find(view)];r.cover=r.images[+el.dataset.k];mark();render(true);}
  else if(act==='read-pdf'){var dt=el.closest('.doc');openReader(id,dt?dt.querySelector('.doc-t').textContent:'');}
  else if(act==='close-reader'){closeReader();}
  else if(act==='add-pdf'){pick(true,'application/pdf').then(function(fs){if(!fs.length)return;uploadMany(fs).then(function(ids){if(!ids.length)return;var p=S.projects[find(view)];p.docs=p.docs||[];ids.forEach(function(x,n){p.docs.push({id:x,title:(fs[n]&&fs[n].name?fs[n].name.replace(/\.pdf$/i,''):'Document'),desc:''});});mark();render(true);});});}
  else if(act==='rm-doc'){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirm';return;}var pd=S.projects[find(view)];pd.docs.splice(+el.dataset.k,1);mark();render(true);}
  else if(act==='doc-mv'){var pm=S.projects[find(view)],a2=+el.dataset.k,b2=a2+(+el.dataset.d);if(b2>=0&&b2<pm.docs.length){var tm=pm.docs[a2];pm.docs[a2]=pm.docs[b2];pm.docs[b2]=tm;mark();render(true);}}
  else if(act==='add-detail'){S.details.push({k:'Label',v:'Details'});mark();render(true);}
  else if(act==='rm-detail'){S.details.splice(+el.dataset.i,1);mark();render(true);}
});
window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

render();

if(window.claude&&window.claude.use){
  Promise.all([
    window.claude.use('user').catch(function(){return null;}),
    window.claude.use('artifact').catch(function(){return null;}),
    window.claude.use('assets').catch(function(){return null;})
  ]).then(function(r){
    api.artifact=r[1];api.assets=r[2];
    var p=r[0]?r[0].canEdit():Promise.resolve(false);
    return p.then(function(ok){
      canEdit=!!(ok&&api.artifact);
      if(!canEdit){editing=false;try{sessionStorage.removeItem('pf-edit');}catch(e){}}
      render(true);
    });
  }).catch(function(){});
}else{editing=false;}
})();
</script>
</body></html>
